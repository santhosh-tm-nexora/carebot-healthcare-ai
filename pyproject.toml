[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carebot-healthcare-ai"
version = "0.1.0"
description = "Clinical note summarization with realtime doctor voice transcripts"
requires-python = ">=3.10"
dependencies = [
    "spacy>=3.8,<3.9",
    "pydantic>=2.5",
    "openai>=1.0",
    "pytest>=8.0",
    "mlflow>=2.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
carebot = ["static/*.html"]
